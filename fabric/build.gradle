// loom-no-remap: there is no remapJar. The Loom-processed `jar` becomes the "raw" base,
// and shadowJar (which bundles the common module) becomes the primary output artifact.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()    // don't re-add the raw source set; use Loom's processed jar
    from(zipTree(jar.archiveFile))  // preserves Loom modifications (e.g. JiJ metadata)

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    exclude "architectury_inject*/**"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Make the shadowJar (bundled, primary artifact) part of the normal build.
tasks.named("assemble").configure {
    dependsOn tasks.named("shadowJar")
}
