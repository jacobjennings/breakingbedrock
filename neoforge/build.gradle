plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        clientDebug {
            client()
            ideConfigGenerated true
            name = "Minecraft Client Debug"
            source sourceSets.main
            property 'mixin.debug', 'true'
            property "fabric.log.level", "debug"
        }

        serverDebug {
            server()
            ideConfigGenerated true
            name = "Minecraft Server Debug"
            source sourceSets.main
            property 'mixin.debug', 'true'
            property "fabric.log.level", "debug"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url 'https://maven.neoforged.net/releases/' }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    // Dev-only testing mods (no 26.1.2 builds wired up yet):
//    localRuntime "maven.modrinth:modernfix:rOLLd6NG"
//    localRuntime "maven.modrinth:ferrite-core:$ferrite_core_version-neoforge"
//    localRuntime "maven.modrinth:sodium:$sodium_version-neoforge"
}

tasks.withType(Jar).configureEach {
    manifest.attributes.put 'MixinConfigs', mod_id + '.mixins.json'
}

// loom-no-remap: there is no remapJar. The Loom-processed `jar` becomes the "raw" base,
// and shadowJar (which bundles the common module) becomes the primary output artifact.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()    // don't re-add the raw source set; use Loom's processed jar
    from(zipTree(jar.archiveFile))  // preserves Loom modifications

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    exclude "architectury_inject*/**"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Make the shadowJar (bundled, primary artifact) part of the normal build.
tasks.named("assemble").configure {
    dependsOn tasks.named("shadowJar")
}